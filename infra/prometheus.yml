# Prometheus scrape config for GuardianAI services.
# `prometheus_fastapi_instrumentator` exposes /metrics on every FastAPI app.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: guardian-ai

scrape_configs:
  - job_name: guardian-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: backend
          env: docker

  - job_name: guardian-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ['proxy:8001']
        labels:
          service: proxy
          env: docker

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus
          env: docker
