# Nginx config for the GuardianAI frontend container.
# Serves the Vite build under / and reverse-proxies the governance
# (`/api/*`) + OpenAI-compatible (`/v1/*`) routes to the backend / proxy
# services on the docker compose network.
server {
    listen 80 default_server;
    server_name _;

    # Static SPA bundle
    root /usr/share/nginx/html;
    index index.html;

    # Don't cache index.html (it references hashed asset filenames)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed assets are immutable (Vite emits content-hashed filenames)
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Backend governance + medrag + diagnose API
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE — disable buffering so token chunks ship immediately
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # OpenAI-compatible HTTP proxy
    location /v1/ {
        proxy_pass         http://proxy:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # SPA fallback — anything else returns the index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
