providers:
  openai:
    base_url: https://api.openai.com/v1
    auth_env: OPENAI_API_KEY
    api_format: openai
  anthropic:
    base_url: https://api.anthropic.com/v1
    auth_env: ANTHROPIC_API_KEY
    api_format: anthropic_messages
  groq:
    base_url: https://api.groq.com/openai/v1
    auth_env: GROQ_API_KEY
    api_format: openai

# Routing rules: model glob → provider name. First match wins.
route_by_model:
  - pattern: "gpt-*"
    provider: openai
  - pattern: "o1-*"
    provider: openai
  - pattern: "claude-*"
    provider: anthropic
  - pattern: "llama-*"
    provider: groq
  - pattern: "mixtral-*"
    provider: groq

# Default if no rule matches.
default_provider: groq
