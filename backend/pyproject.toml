[project]
name = "guardianai"
version = "0.1.0"
description = "Causal multi-agent runtime governance for LLM applications"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "syedwam7q" }]
urls = { Repository = "https://github.com/syedwam7q/guardian-ai" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "groq>=0.13.0",
    "anthropic>=0.40.0",
    "duckdb>=1.1.0",
    "chromadb>=0.5.20",
    "sentence-transformers>=3.3.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "dowhy>=0.12.0",
    "networkx>=3.4.0",
    "presidio-analyzer>=2.2.358",
    "presidio-anonymizer>=2.2.358",
    "spacy>=3.8.0",
    "detoxify>=0.5.2",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "mlflow>=2.18.0",
    "reportlab>=4.2.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.118.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "pre-commit>=4.0.0",
    "ipython>=8.29.0",
]
eval = [
    "datasets>=3.1.0",
    "evaluate>=0.4.3",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
