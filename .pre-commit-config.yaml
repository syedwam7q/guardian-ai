repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: local
    hooks:
      - id: prettier-frontend
        name: prettier-frontend
        # Requires `cd frontend && npm install` first; gracefully skips if unavailable.
        entry: bash -c 'if [ -x frontend/node_modules/.bin/prettier ]; then cd frontend && ./node_modules/.bin/prettier --write --ignore-unknown "$@"; else echo "skip: run cd frontend && npm install"; fi'
        language: system
        files: ^frontend/src/.*\.(ts|tsx|css|json)$
        pass_filenames: true
